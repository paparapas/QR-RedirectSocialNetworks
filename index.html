<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyblade Portugal - Links</title>
    <style>
        body {
            background-color: #0f111a; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilos para o Logotipo Oficial */
        .main-logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        .header h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
        }
        
        .header p {
            color: #a0aabf;
            font-size: 16px;
            margin: 0;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: #1f2333;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 17px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        }

        .link-card:hover, .link-card:active {
            transform: scale(1.02);
            background-color: #2a2f45;
        }

        .link-icon {
            width: 32px;
            height: 32px;
            margin-right: 20px;
            object-fit: contain;
        }

        /* Ajuste específico para o Instagram parecer do mesmo tamanho */
        .instagram-icon {
            transform: scale(1.4); 
            margin-left: 2px;
            margin-right: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Logotipo BBPT adicionado aqui -->
        <img src="logo.png" alt="Logotipo Beyblade Portugal" class="main-logo">
        <h1>BEYBLADE PORTUGAL</h1>
        <p>Junta-te à comunidade!</p>
    </div>

    <div class="links-container">
        <!-- Instagram com classe específica para ajustar o tamanho -->
        <a href="https://www.instagram.com/beyblade_pt" class="link-card" target="_blank" rel="noopener noreferrer">
            <img src="instagram.png" alt="Instagram" class="link-icon instagram-icon">
            Instagram
        </a>

        <!-- WhatsApp -->
        <a href="https://chat.whatsapp.com/GCLf0RjTFjFHzc1yK2VjPo" class="link-card" target="_blank" rel="noopener noreferrer">
            <img src="whatsapp.png" alt="WhatsApp" class="link-icon">
            Comunidade WhatsApp
        </a>

        <!-- Discord -->
        <a href="https://discord.com/invite/KssWPXxFnq" class="link-card" target="_blank" rel="noopener noreferrer">
            <img src="discord.png" alt="Discord" class="link-icon">
            Servidor Discord
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/@BeybladePortugal" class="link-card" target="_blank" rel="noopener noreferrer">
            <img src="youtube.png" alt="YouTube" class="link-icon">
            Canal de YouTube
        </a>
    </div>

</body>
</html>
